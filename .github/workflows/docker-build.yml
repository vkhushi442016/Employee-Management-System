name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'apiGateway/**'
      - 'docker-compose.prod.yml'

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Auth Service
        run: |
          docker build -t khushiverma18/auth-service:latest \
          -f backend/services/auth-service/Dockerfile \
          backend

      - name: Push Auth Service
        run: docker push khushiverma18/auth-service:latest

      - name: Build Employee Service
        run: |
          docker build -t khushiverma18/employee-service:latest \
          -f backend/services/employee-service/Dockerfile \
          backend

      - name: Push Employee Service
        run: docker push khushiverma18/employee-service:latest

      - name: Build Notification Service
        run: |
          docker build -t khushiverma18/notification-service:latest \
          -f backend/services/notification-service/Dockerfile \
          backend

      - name: Push Notification Service
        run: docker push khushiverma18/notification-service:latest

      - name: Build API Gateway
        run: |
          docker build -t khushiverma18/api-gateway:latest \
          -f apiGateway/Dockerfile \
          apiGateway

      - name: Push API Gateway
        run: docker push khushiverma18/api-gateway:latest

  deploy:

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/EmployeeManagementSystem

            sudo docker compose -f docker-compose.prod.yml pull

            sudo docker compose -f docker-compose.prod.yml up -d